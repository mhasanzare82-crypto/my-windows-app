name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "main.js"
      - "package.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron and builder
        run: npm install --save-dev electron electron-builder

      - name: Build portable EXE
        run: npm run dist

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Daftarche-Yaddasht-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
